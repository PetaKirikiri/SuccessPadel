[api]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]

# This pre-session endpoint authenticates the LINE ID token with LINE itself.
[functions.line-liff-recognize]
verify_jwt = false
[functions.competition-signup]
verify_jwt = false

# Both signed-in staff and owner capabilities are validated inside the handler.
[functions.member-directory-avatar]
verify_jwt = false
